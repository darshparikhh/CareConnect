[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "careconnect-backend"
version = "0.1.0"
description = "CareConnect backend: FastAPI + SQLAlchemy/SQLite API hosting the Matching and Recommendation data science engines."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi==0.111.0",
    "uvicorn[standard]==0.30.1",
    "pydantic==2.7.4",
    "SQLAlchemy==2.0.30",
    "numpy==1.26.4",
]

[project.optional-dependencies]
test = [
    "pytest==8.2.2",
    "hypothesis==6.103.1",
    "httpx==0.27.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["app/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra"
